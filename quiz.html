<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pathified — Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
  <link rel="stylesheet" href="css/nav.css"/>
  <link rel="stylesheet" href="css/quiz.css"/>
</head>
<body>

  <div class="cursor"></div>
  <div class="cursor-dot"></div>

  <nav class="quiz-nav">
    <a href="index.html" class="logo">Pathified</a>
  </nav>

  <div class="quiz-progress-wrap">
    <div class="quiz-progress-bar" id="progress-bar"></div>
  </div>
  <div class="quiz-nav-meta">
    <span id="question-counter">Question 1 of 25</span>
  </div>

  <section class="quiz-container" id="quiz-container">
    <div class="quiz-inner" id="quiz-inner">

      <h2 class="quiz-question" id="question-text"></h2>

      <div class="quiz-options" id="options-container"></div>

      <!-- Q26 optional step — id="optional-container" is what quiz.js expects -->
      <div class="quiz-optional" id="optional-container">
        <br>
        <p class="optional-subtext">Optional — this won't change your score but may add nuance.</p>
        <textarea id="optional-q26-input" placeholder="Type here..."></textarea>
        <div class="optional-btns">
          <button class="btn-primary" id="submit-btn">Submit &amp; see my results</button>
          <button class="btn-ghost"   id="skip-btn">Skip</button>
        </div>
      </div>

      <div class="quiz-back-wrap">
        <button id="back-btn" class="back-link">&#8592; Back</button>
      </div>
    </div>

    <!-- Summary screen shown while traits are extracted -->
    <div class="summary-screen" id="summary-screen">
      <div class="summary-inner">
        <p class="summary-label">Building your profile</p>
        <h2 class="summary-title">Here's what we found<br><em>about you</em></h2>
        <div class="traits-container" id="traits-container"></div>
        <p class="summary-sub">Generating your career matches...</p>
      </div>
    </div>

    <!-- Loading overlay inside quiz area — JS controls display -->
    <div class="loading-overlay" id="loading-overlay" style="display:none;">
      <div class="pixel-loader">
        <div class="pixel"></div><div class="pixel"></div><div class="pixel"></div>
        <div class="pixel"></div><div class="pixel"></div><div class="pixel"></div>
        <div class="pixel"></div><div class="pixel"></div><div class="pixel"></div>
      </div>
      <div class="loading-text" id="loading-text">Reading between the lines...</div>
    </div>

    <!-- Full page loader for final submission — JS controls display -->
    <div class="full-loader" id="full-loader" style="display:none;">
      <div class="orb orb1"></div>
      <div class="orb orb3"></div>
      <div class="pixel-loader">
        <div class="pixel"></div><div class="pixel"></div><div class="pixel"></div>
        <div class="pixel"></div><div class="pixel"></div><div class="pixel"></div>
        <div class="pixel"></div><div class="pixel"></div><div class="pixel"></div>
      </div>
      <div class="loading-text">Synthesizing your profile...</div>
    </div>

  </section>

  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
    <span class="theme-icon-light">☀︎</span>
    <span class="theme-icon-dark">☽</span>
  </button>

  <script src="js/cursor.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/animations.js"></script>
  <script src="config.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
